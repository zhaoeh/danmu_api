[build]
  command = "npm install"
  publish = "."

[build.environment]
  TOKEN = "smb798"
  ANIME_TITLE_FILTER = "越南语版|速看版|国际版"
  GROUP_MINUTE = "0.17"
  COMMENT_CACHE_MINUTES = "60"
  PLATFORM_ORDER = "bilibili,qq,iqiyi,youku,mango"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api"
  status = 200
